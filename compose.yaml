services:
  postgres:
    image: 'postgres:latest'
    environment:
    - 'POSTGRES_DB=mydatabase'
    - 'POSTGRES_PASSWORD=secret'
    - 'POSTGRES_USER=myuser'
    ports:
    - '5432:5432'
  zipkin:
    image: ghcr.io/openzipkin-contrib/zipkin-otel:main
    ports:
    - '9411:9411'
    environment:
      UI_ENABLED: 'true'